<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manajemen BMN</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="no">
 <h1>Manajemen BMN<small id="inst">Daftar Barang Milik Negara</small></h1>
 <div class="header-actions">
  <button class="btn p" id="bAdd">+ Tambah barang</button>
  <button class="btn" id="bPrint">Cetak / Simpan PDF</button>
  <button class="btn" id="bCsv">Ekspor CSV</button>
  <button class="btn" id="bBak">Cadangkan</button>
  <button class="btn" id="bRes">Pulihkan</button>
  <button class="btn" id="bSet">Pengaturan</button>
  <input type="file" id="file" accept=".json" hidden>
 </div>
</header>

<main>
 <form class="bar no" id="authForm">
  <input id="authEmail" type="email" placeholder="Email Firebase" aria-label="Email Firebase" required>
  <input id="authPassword" type="password" placeholder="Kata sandi" aria-label="Kata sandi" required>
  <button class="btn p" id="bLogin" type="submit">Masuk</button>
  <button class="btn" id="bLogout" type="button" hidden>Keluar</button>
  <span class="db-status" id="dbStatus" role="status">Menghubungkan ke Firebase...</span>
 </form>
 <section class="sum no" id="sum"></section>
 <section class="bar no">
  <input type="search" id="q" placeholder="Cari kode, NUP, nama, lokasi, penanggung jawab" aria-label="Cari barang">
  <select id="fc" aria-label="Filter kategori"></select>
  <select id="fk" aria-label="Filter kondisi"></select>
 </section>

 <div class="po kop">
  <b id="pInst"></b><span id="pUnit"></span>
  <h2>Daftar Barang Milik Negara</h2>
  <span id="pInfo"></span>
 </div>

 <div class="wrap">
  <table>
   <thead><tr>
   <th>No</th><th>Kode Barang</th><th>NUP</th><th>Jumlah</th><th>Nama Barang</th><th>Merek / Tipe</th><th>Tahun</th>
    <th class="n">Nilai Perolehan (Rp)</th><th>Kondisi</th><th>Lokasi</th><th>Penanggung Jawab</th><th>Keterangan</th><th class="no">Aksi</th>
   </tr></thead>
   <tbody id="tb"></tbody>
   <tfoot id="tf"></tfoot>
  </table>
  <div class="empty" id="empty" hidden></div>
 </div>

 <div class="po ttd">
  <span id="pTempat"></span><br><span id="pJab"></span>
  <div></div>
  <b id="pNama"></b>
 </div>

</main>

<dialog id="dlg">
 <form id="frm" method="dialog">
  <h2 id="dT">Tambah barang</h2>
  <div class="g">
   <label>Kategori<select id="kat"></select></label>
   <label>Kondisi<select id="kon"></select></label>
   <label>Kode barang *<input id="kode" required maxlength="20" inputmode="numeric" placeholder="3100102001"></label>
   <label>NUP *<input id="nup" required maxlength="8" inputmode="numeric" placeholder="1"></label>
   <label>Jumlah barang *<input id="jml" type="number" min="1" step="1" value="1" required></label>
   <label class="f">Nama barang *<input id="nama" required maxlength="80"></label>
   <label>Merek / tipe<input id="mrk" maxlength="60"></label>
   <label>Tahun perolehan<input id="thn" type="number" min="1945" max="2100" placeholder="2024"></label>
   <label>Nilai perolehan (Rp)<input id="nil" type="number" min="0" step="1"></label>
   <label>Lokasi / ruangan<input id="lok" maxlength="60"></label>
   <label class="f">Penanggung jawab<input id="pj" maxlength="60"></label>
   <label class="f">Keterangan<textarea id="ket" rows="2" maxlength="200"></textarea></label>
  </div>
  <div class="err" id="err" role="alert"></div>
  <div class="act"><button class="btn" type="button" id="dCancel">Batal</button><button class="btn p" type="submit">Simpan</button></div>
 </form>
</dialog>

<dialog id="dlgS">
 <form id="frmS" method="dialog">
  <h2>Pengaturan kop dan tanda tangan</h2>
  <div class="g">
   <label class="f">Nama instansi<input id="sN" maxlength="80"></label>
   <label class="f">Unit / alamat<input id="sU" maxlength="120"></label>
   <label>Kota (untuk tanda tangan)<input id="sT" maxlength="40"></label>
   <label>Jabatan penandatangan<input id="sJ" maxlength="60"></label>
   <label class="f">Nama penandatangan<input id="sP" maxlength="60"></label>
  </div>
  <div class="act"><button class="btn" type="button" id="sCancel">Batal</button><button class="btn p" type="submit">Simpan</button></div>
 </form>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const KEY='bmn1';
const firebaseConfig={apiKey:'AIzaSyBT0gjTuT0vV5Qn2QJWAwpm5Bl69rdvvbk',authDomain:'bmn-digidaw.firebaseapp.com',projectId:'bmn-digidaw',storageBucket:'bmn-digidaw.firebasestorage.app',messagingSenderId:'143370549470',appId:'1:143370549470:web:bfa5ca1e15f0c630226a4f',measurementId:'G-TYFT23ZE41'};
const KAT=['Tanah','Peralatan dan Mesin','Gedung dan Bangunan','Jalan, Irigasi, Jaringan','Aset Tetap Lainnya','Aset Tak Berwujud'];
const KON=['Baik','Rusak Ringan','Rusak Berat'];
/* Penyimpanan hemat: tiap barang disimpan sebagai array pendek, bukan objek.
   [id, kode, nup, nama, merek, tahun, nilai, kondisi(0-2), kategori(0-5), lokasi, pj, ket, jumlah]
   Kondisi dan kategori disimpan sebagai angka kode, teksnya diambil dari daftar di atas. */
let D={s:{},r:[],id:1};
let dbRef=null,dataReady=false;
const $=i=>document.getElementById(i);
const rp=n=>new Intl.NumberFormat('id-ID').format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let editId=null;

function setDbStatus(text,error=false){$('dbStatus').textContent=text;$('dbStatus').classList.toggle('error',error)}
function setControlsEnabled(enabled){['bAdd','bPrint','bCsv','bBak','bRes','bSet','q','fc','fk'].forEach(id=>$(id).disabled=!enabled)}
function toCloud(){return {s:D.s,id:D.id,r:D.r.map(r=>({id:r[0],code:r[1],nup:r[2],name:r[3],brand:r[4],year:r[5],value:r[6],condition:r[7],category:r[8],location:r[9],owner:r[10],note:r[11],quantity:r[12]||1}))}}
function fromCloud(o){return {s:o.s||{},id:o.id||1,r:(o.r||[]).map(r=>Array.isArray(r)?[...r.slice(0,12),Math.max(1,Math.floor(+r[12]||1))]:[r.id,r.code,r.nup,r.name,r.brand,r.year,r.value,+r.condition,+r.category,r.location,r.owner,r.note,Math.max(1,Math.floor(+r.quantity||1))])}}
async function loadCloud(){
 const snap=await dbRef.get();
 if(snap.exists){D=fromCloud(snap.data());return}
 const legacy=localStorage.getItem(KEY);
 if(legacy){try{const old=JSON.parse(legacy);if(old&&Array.isArray(old.r))D=fromCloud(old)}catch(e){}}
 await dbRef.set(toCloud());
 if(legacy)localStorage.removeItem(KEY);
}
async function save(){try{if(!dbRef)throw new Error('Firebase belum siap');await dbRef.set(toCloud());setDbStatus('Data tersimpan di Firebase');return true}catch(e){console.error(e);setDbStatus('Gagal menyimpan ke Firebase: '+e.message,true);alert('Data tidak tersimpan ke Firebase. Periksa koneksi dan aturan Firestore.');return false}}

function fill(sel,arr,all){sel.innerHTML=(all?`<option value="">${all}</option>`:'')+arr.map((t,i)=>`<option value="${i}">${t}</option>`).join('')}
fill($('fc'),KAT,'Semua kategori');fill($('fk'),KON,'Semua kondisi');fill($('kat'),KAT);fill($('kon'),KON);

function view(){
 const q=$('q').value.trim().toLowerCase(),c=$('fc').value,k=$('fk').value;
 return D.r.filter(r=>(c===''||r[8]==c)&&(k===''||r[7]==k)&&(!q||[r[1],r[2],r[3],r[4],r[9],r[10]].join(' ').toLowerCase().includes(q)));
}

function render(){
 const v=view(),tot=v.reduce((a,r)=>a+(+r[6]||0),0),qty=r=>(+r[12]||1);
 $('tb').innerHTML=v.map((r,i)=>`<tr>
  <td>${i+1}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="n">${qty(r)}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td>${esc(r[5])}</td>
  <td class="n">${rp(r[6])}</td><td><span class="k k${r[7]}">${KON[r[7]]}</span></td><td>${esc(r[9])}</td><td>${esc(r[10])}</td><td>${esc(r[11])}</td>
  <td class="no" style="white-space:nowrap"><button class="btn s" data-e="${r[0]}">Ubah</button> <button class="btn s d" data-d="${r[0]}">Hapus</button></td></tr>`).join('');
 $('tf').innerHTML=v.length?`<tr><td colspan="3">Total</td><td class="n">${v.reduce((a,r)=>a+qty(r),0)}</td><td colspan="3"></td><td class="n">${rp(tot)}</td><td colspan="5"></td></tr>`:'';
 const em=$('empty');em.hidden=v.length>0;
 em.textContent=D.r.length?'Tidak ada barang yang cocok dengan pencarian atau filter.':'Belum ada data. Klik "Tambah barang" untuk memulai.';
 const all=D.r,kc=[0,1,2].map(n=>all.filter(r=>r[7]==n).reduce((a,r)=>a+(+r[12]||1),0));
 $('sum').innerHTML=[[all.reduce((a,r)=>a+(+r[12]||1),0),'Jumlah barang'],['Rp '+rp(all.reduce((a,r)=>a+(+r[6]||0),0)),'Total nilai perolehan'],[kc[0],'Kondisi baik'],[kc[1],'Rusak ringan'],[kc[2],'Rusak berat']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
 const s=D.s;$('inst').textContent=s.n||'Daftar Barang Milik Negara';
}

/* Tambah / ubah */
function openForm(id){
 editId=id;$('err').textContent='';$('frm').reset();
 $('dT').textContent=id?'Ubah barang':'Tambah barang';
 if(id){const r=D.r.find(x=>x[0]==id);
   $('kode').value=r[1];$('nup').value=r[2];$('jml').value=r[12]||1;$('nama').value=r[3];$('mrk').value=r[4];$('thn').value=r[5];$('nil').value=r[6];
  $('kon').value=r[7];$('kat').value=r[8];$('lok').value=r[9];$('pj').value=r[10];$('ket').value=r[11];}
 $('dlg').showModal();$('kode').focus();
}
$('frm').addEventListener('submit',async e=>{
 const kode=$('kode').value.trim(),nup=$('nup').value.trim();
 if(D.r.some(r=>r[1]==kode&&r[2]==nup&&r[0]!=editId)){e.preventDefault();$('err').textContent='Kode barang '+kode+' dengan NUP '+nup+' sudah ada. Gunakan NUP lain atau ubah data yang sudah ada.';return}
 const row=[editId||D.id,kode,nup,$('nama').value.trim(),$('mrk').value.trim(),$('thn').value,+$('nil').value||0,+$('kon').value,+$('kat').value,$('lok').value.trim(),$('pj').value.trim(),$('ket').value.trim(),Math.max(1,Math.floor(+$('jml').value||1))];
 e.preventDefault();if(!dataReady)return;
 const backup=JSON.stringify(D);
 if(editId){D.r[D.r.findIndex(x=>x[0]==editId)]=row}else{D.r.push(row);D.id++}
 render();if(await save())$('dlg').close();else{D=JSON.parse(backup);render()}
});
$('dCancel').onclick=()=>$('dlg').close();
$('bAdd').onclick=()=>openForm(null);
$('tb').addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.e)openForm(+b.dataset.e);
 if(b.dataset.d){const r=D.r.find(x=>x[0]==b.dataset.d);
  if(confirm('Hapus "'+r[3]+'" (NUP '+r[2]+')? Tindakan ini tidak bisa dibatalkan.')){const backup=JSON.stringify(D);D.r=D.r.filter(x=>x[0]!=r[0]);render();if(!await save()){D=JSON.parse(backup);render()}}}
});
['q','fc','fk'].forEach(i=>$(i).addEventListener('input',render));

/* Pengaturan */
$('bSet').onclick=()=>{const s=D.s;$('sN').value=s.n||'';$('sU').value=s.u||'';$('sT').value=s.t||'';$('sJ').value=s.j||'';$('sP').value=s.p||'';$('dlgS').showModal()};
$('sCancel').onclick=()=>$('dlgS').close();
$('frmS').addEventListener('submit',async e=>{e.preventDefault();if(!dataReady)return;const backup=JSON.stringify(D);D.s={n:$('sN').value.trim(),u:$('sU').value.trim(),t:$('sT').value.trim(),j:$('sJ').value.trim(),p:$('sP').value.trim()};if(await save()){$('dlgS').close();render()}else{D=JSON.parse(backup);render()}});

/* Cetak / PDF */
$('bPrint').onclick=()=>{
 const s=D.s,v=view(),tgl=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
 const f=[];if($('fc').value!=='')f.push(KAT[$('fc').value]);if($('fk').value!=='')f.push('Kondisi '+KON[$('fk').value]);if($('q').value.trim())f.push('Pencarian "'+$('q').value.trim()+'"');
 $('pInst').textContent=s.n||'';$('pUnit').textContent=s.u||'';
 $('pInfo').textContent='Per '+tgl+(f.length?' · '+f.join(', '):'')+' · '+v.length+' barang';
 $('pTempat').textContent=(s.t?s.t+', ':'')+tgl;$('pJab').textContent=s.j||'';$('pNama').textContent=s.p||'';
 if(!v.length){alert('Tidak ada data untuk dicetak.');return}
 window.print();
};

/* Ekspor CSV */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const stamp=()=>new Date().toISOString().slice(0,10);
$('bCsv').onclick=()=>{
 const v=view();if(!v.length){alert('Tidak ada data untuk diekspor.');return}
 const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
 const h=['No','Kode Barang','NUP','Jumlah','Nama Barang','Merek/Tipe','Tahun','Nilai Perolehan','Kondisi','Kategori','Lokasi','Penanggung Jawab','Keterangan'];
 const rows=v.map((r,i)=>[i+1,r[1],r[2],r[12]||1,r[3],r[4],r[5],r[6],KON[r[7]],KAT[r[8]],r[9],r[10],r[11]].map(q).join(','));
 dl('bmn-'+stamp()+'.csv','\ufeff'+[h.map(q).join(','),...rows].join('\r\n'),'text/csv;charset=utf-8');
};

/* Cadangkan / pulihkan */
$('bBak').onclick=()=>dl('cadangan-bmn-'+stamp()+'.json',JSON.stringify(D),'application/json');
$('bRes').onclick=()=>$('file').click();
$('file').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=async()=>{try{
  const o=JSON.parse(rd.result);
  if(!o||!Array.isArray(o.r)||o.r.some(r=>!Array.isArray(r)||r.length<12))throw 0;
  if(confirm('Pulihkan '+o.r.length+' barang dari cadangan? Data saat ini akan diganti.')){const backup=JSON.stringify(D);D=fromCloud(o);D.id=o.id||(Math.max(0,...o.r.map(r=>r[0]))+1);if(await save())render();else D=JSON.parse(backup)}
 }catch(x){alert('File cadangan tidak valid. Pilih file .json hasil tombol Cadangkan.')}};
 rd.readAsText(f);e.target.value='';
});

$('authForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!firebase.apps.length)return;
 $('bLogin').disabled=true;setDbStatus('Sedang masuk...');
 try{await firebase.auth().signInWithEmailAndPassword($('authEmail').value.trim(),$('authPassword').value)}
 catch(x){const message=['auth/configuration-not-found','auth/operation-not-allowed'].includes(x.code)?'Firebase Authentication belum dikonfigurasi. Buka Authentication di Firebase Console, klik Get started, lalu aktifkan Email/Password.':x.message;setDbStatus('Gagal masuk: '+message,true);$('bLogin').disabled=false}
});
$('bLogout').onclick=()=>firebase.auth().signOut();
setControlsEnabled(false);
if(!Object.values(firebaseConfig).every(v=>v&&!v.startsWith('YOUR_'))){$('bLogin').disabled=true;setDbStatus('Isi konfigurasi Firebase di firebaseConfig terlebih dahulu.',true);render()}
else try{
 firebase.initializeApp(firebaseConfig);
 firebase.auth().onAuthStateChanged(async user=>{
  dataReady=false;setControlsEnabled(false);
  $('authEmail').disabled=!!user;$('authPassword').disabled=!!user;$('bLogin').hidden=!!user;$('bLogout').hidden=!user;
  if(!user){D={s:{},r:[],id:1};dbRef=null;$('bLogin').disabled=false;setDbStatus('Masuk dengan akun Firebase untuk memuat data.');render();return}
  setDbStatus('Memuat data dari Firebase...');dbRef=firebase.firestore().collection('users').doc(user.uid).collection('app').doc('bmn');
  try{await loadCloud();dataReady=true;setControlsEnabled(true);setDbStatus('Terhubung ke Firebase sebagai '+user.email);render()}
  catch(x){console.error(x);const message=x.code==='permission-denied'?'Firestore menolak akses. Atur Rules agar pengguna yang masuk dapat membaca dan menulis dokumen users/{uid}/app/{docId}.':x.message;setDbStatus('Gagal memuat Firebase: '+message,true);render()}
 });
}catch(x){setDbStatus('Firebase gagal diinisialisasi: '+x.message,true);$('bLogin').disabled=true;render()}
</script>
</body>
</html>
